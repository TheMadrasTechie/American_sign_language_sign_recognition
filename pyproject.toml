[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signspell"
version = "2.0.0"
description = "Live ASL fingerspelling alphabet recognition with a polished webcam UI."
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = { text = "MIT" }
authors = [{ name = "Sundar", email = "sundarbala36663@gmail.com" }]
keywords = ["asl", "sign-language", "computer-vision", "mediapipe", "fingerspelling", "accessibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = [
    # Model is now trained natively on TF 2.19, which unwinds the old
    # TF-2.15 / Keras-2 / numpy<2 lock. TF 2.19 brings its own Keras 3 and
    # works with numpy 2, so the ranges can breathe again. Two constraints
    # still matter:
    #   - mediapipe must keep the legacy `solutions` API (Holistic), which
    #     was removed after 0.10.x; 0.10.18 has it AND supports Python 3.12.
    #   - opencv/numpy are left to resolve against TF 2.19's numpy.
    "numpy>=1.26",
    "opencv-python>=4.8",
    "mediapipe>=0.10.14,<0.11",
    "tensorflow>=2.19,<2.20",
]

[project.urls]
Homepage = "https://github.com/TheMadrasTechie/signspell"
Repository = "https://github.com/TheMadrasTechie/signspell"
Issues = "https://github.com/TheMadrasTechie/signspell/issues"

[project.scripts]
signspell = "asl_alphabet.cli:main"

[project.optional-dependencies]
dev = ["build", "twine", "pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asl_alphabet = ["models/*.h5"]