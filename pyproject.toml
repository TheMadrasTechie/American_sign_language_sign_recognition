[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signspell"
version = "1.0.1"
description = "Live ASL fingerspelling alphabet recognition with a polished webcam UI."
readme = "README.md"
requires-python = ">=3.9,<3.12"
license = { text = "MIT" }
authors = [{ name = "Sundar", email = "sundarbala36663@gmail.com" }]
keywords = ["asl", "sign-language", "computer-vision", "mediapipe", "fingerspelling", "accessibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = [
    # Pinned as one tested set. These four have tight binary (ABI) coupling:
    # TF 2.15 + ml_dtypes need numpy<2; mediapipe>=0.10.10 drops the
    # solutions API (Holistic); opencv>=4.10 forces numpy>=2. Loosening any
    # of these re-introduces the import crashes, so they stay exact.
    "numpy>=1.26,<2",
    "opencv-python>=4.8,<4.10",
    "mediapipe==0.10.9",
    "tensorflow==2.15.1",
]

[project.urls]
Homepage = "https://github.com/TheMadrasTechie/signspell"
Repository = "https://github.com/TheMadrasTechie/signspell"
Issues = "https://github.com/TheMadrasTechie/signspell/issues"

[project.scripts]
signspell = "asl_alphabet.cli:main"

[project.optional-dependencies]
dev = ["build", "twine", "pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asl_alphabet = ["models/*.h5"]